<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Option C — Login | Crestline Markets</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <span class="preview-tag">Preview C · Login</span>
  <header class="nav">
    <a class="logo" href="../../index.html"><span class="mark"></span>Crestline Markets</a>
    <a class="muted" href="../../index.html">Back to site</a>
  </header>
  <main class="stage">
    <div class="glass">
      <h1>Welcome back</h1>
      <p class="sub">Sign in to continue to your portal.</p>
      <form action="#" method="post" onsubmit="return false">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@email.com" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <div class="meta"><a href="#">Forgot password?</a></div>
        <button class="btn" type="submit">Sign in</button>
      </form>
      <p class="switch">New trader? <a href="register.html">Create account</a></p>
    </div>
  </main>
</body>
</html>
