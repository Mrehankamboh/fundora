<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Option B — Register | Crestline Markets</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <span class="preview-tag">Preview B · Register</span>
  <div class="top">
    <a class="logo" href="../../index.html"><span class="mark"></span>Crestline Markets</a>
    <a class="muted" href="../../index.html">Back to site</a>
  </div>
  <div class="box">
    <h1>Register</h1>
    <p class="sub">Create your Crestline account.</p>
    <form action="#" method="post" onsubmit="return false">
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" type="text" placeholder="Alex Morgan" autocomplete="name" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@email.com" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" required />
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input id="confirm" type="password" placeholder="Repeat password" autocomplete="new-password" required />
      </div>
      <button class="btn" type="submit">Create account</button>
    </form>
    <p class="switch">Have an account? <a href="login.html">Sign in</a></p>
  </div>
</body>
</html>
