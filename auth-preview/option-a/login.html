<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Option A — Login | Crestline Markets</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <span class="preview-tag">Preview A · Login</span>
  <div class="shell">
    <aside class="brand">
      <a class="logo" href="../../index.html"><span class="mark"></span>Crestline Markets</a>
      <div class="brand-copy">
        <h1>Trade with institutional discipline.</h1>
        <p>Sign in to manage challenges, track objectives, and request rewards.</p>
      </div>
      <p style="color:var(--muted);font-size:0.85rem;position:relative;z-index:1">© Crestline Markets</p>
    </aside>
    <main class="panel">
      <div class="form-wrap">
        <h2>Welcome back</h2>
        <p class="sub">Enter your credentials to continue.</p>
        <form action="#" method="post" onsubmit="return false">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="you@email.com" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
          </div>
          <div class="row">
            <label style="text-transform:none;letter-spacing:0;display:flex;gap:0.4rem;align-items:center;margin:0;font-size:0.88rem;color:var(--muted)">
              <input type="checkbox" style="width:auto;min-height:auto" /> Remember me
            </label>
            <a href="#">Forgot password?</a>
          </div>
          <button class="btn" type="submit">Sign in</button>
        </form>
        <p class="switch">New here? <a href="register.html">Create an account</a></p>
      </div>
    </main>
  </div>
</body>
</html>
