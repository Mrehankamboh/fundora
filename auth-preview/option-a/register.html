<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Option A — Register | Crestline Markets</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <span class="preview-tag">Preview A · Register</span>
  <div class="shell">
    <aside class="brand">
      <a class="logo" href="../../index.html"><span class="mark"></span>Crestline Markets</a>
      <div class="brand-copy">
        <h1>Begin your evaluation.</h1>
        <p>Create an account to choose a challenge and start trading with clear rules.</p>
      </div>
      <p style="color:var(--muted);font-size:0.85rem;position:relative;z-index:1">© Crestline Markets</p>
    </aside>
    <main class="panel">
      <div class="form-wrap">
        <h2>Create account</h2>
        <p class="sub">A few details to get started.</p>
        <form action="#" method="post" onsubmit="return false">
          <div class="field">
            <label for="name">Full name</label>
            <input id="name" type="text" placeholder="Alex Morgan" autocomplete="name" required />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="you@email.com" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" required />
          </div>
          <div class="field">
            <label for="confirm">Confirm password</label>
            <input id="confirm" type="password" placeholder="Repeat password" autocomplete="new-password" required />
          </div>
          <button class="btn" type="submit">Create account</button>
        </form>
        <p class="switch">Already have an account? <a href="login.html">Sign in</a></p>
      </div>
    </main>
  </div>
</body>
</html>
