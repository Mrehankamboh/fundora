<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account — Fundora</title>
  <link rel="icon" href="images/logo-fundora.jpg" type="image/jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/support-widget.css?v=9" />
</head>
<body>
  <div class="shell">
    <aside class="brand">
      <a class="logo" href="index.html"><img class="mark" src="images/logo-fundora.jpg" alt="" width="36" height="36" />Fundora</a>
      <div class="brand-stage">
        <h1 class="brand-headline">Begin your<br />evaluation.</h1>
        <div class="brand-globe fundora-globe" data-size="320" data-min="240">
          <div class="globe-halo" aria-hidden="true"></div>
          <canvas aria-label="Interactive world globe. Drag to rotate."></canvas>
          <p class="globe-hint">Drag to explore</p>
        </div>
      </div>
    </aside>
    <main class="panel">
      <div class="glass glass-wide">
        <h2>Join Fundora</h2>
        <p class="sub">Open an account and start your challenge.</p>
        <button class="btn-google" type="button" id="googleAuthBtn" data-google-auth>
          <svg class="google-ico" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google
        </button>
        <div class="auth-divider" aria-hidden="true"><span>or</span></div>
        <form action="#" method="post">
          <div class="field-grid">
            <div class="field">
              <label for="name">Full name</label>
              <input id="name" type="text" placeholder="Alex Morgan" autocomplete="name" required />
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" type="email" placeholder="you@email.com" autocomplete="email" required />
            </div>
            <div class="field">
              <label for="country">Country</label>
              <select id="country" name="country" autocomplete="country-name" required>
                <option value="" disabled selected>Select country</option>
                <option>United States</option>
                <option>United Kingdom</option>
                <option>Canada</option>
                <option>United Arab Emirates</option>
                <option>Pakistan</option>
                <option>India</option>
                <option>Germany</option>
                <option>France</option>
                <option>Australia</option>
                <option>Singapore</option>
                <option>Other</option>
              </select>
            </div>
            <div class="field">
              <label for="phone">Phone number</label>
              <input id="phone" type="tel" placeholder="+1 555 000 0000" autocomplete="tel" required />
            </div>
            <div class="field">
              <label for="city">City</label>
              <input id="city" type="text" placeholder="New York" autocomplete="address-level2" />
            </div>
            <div class="field">
              <label for="experience">Trading experience</label>
              <select id="experience" name="experience" required>
                <option value="" disabled selected>Select level</option>
                <option>Less than 1 year</option>
                <option>1–3 years</option>
                <option>3–5 years</option>
                <option>5+ years</option>
              </select>
            </div>
            <div class="field">
              <label for="platform">Preferred platform</label>
              <select id="platform" name="platform" required>
                <option value="" disabled selected>Select platform</option>
                <option>MetaTrader 5</option>
                <option>cTrader</option>
                <option>Not sure yet</option>
              </select>
            </div>
            <div class="field">
              <label for="referral">Referral code (optional)</label>
              <input id="referral" type="text" placeholder="FUNDORA-XXXX" autocomplete="off" />
            </div>
            <div class="field">
              <label for="password">Password</label>
              <div class="password-wrap">
                <input id="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" required minlength="8" />
                <button class="eye-btn" type="button" data-toggle-password="password" aria-label="Show password" aria-pressed="false">
                  <svg class="eye-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5c-5 0-9.3 3.1-11 7 1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9zm0-2.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>
                  <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.3 2.3 2 3.6l3.1 3.1C3.2 8.1 1.6 9.9 1 12c1.7 3.9 6 7 11 7 1.8 0 3.5-.4 5-1.1l3.4 3.4 1.3-1.3L3.3 2.3zM12 17c-3.7 0-6.9-2.1-8.5-5 .7-1.4 1.9-2.7 3.4-3.5l1.7 1.7A4.5 4.5 0 0 0 12 16.5V17zm0-10.5c3.7 0 6.9 2.1 8.5 5-.5 1-1.3 1.9-2.2 2.7l-1.5-1.5c.4-.5.7-1.1.7-1.7A4.5 4.5 0 0 0 12 7.5z"/></svg>
                </button>
              </div>
            </div>
            <div class="field">
              <label for="confirm">Confirm password</label>
              <div class="password-wrap">
                <input id="confirm" type="password" placeholder="Repeat password" autocomplete="new-password" required minlength="8" />
                <button class="eye-btn" type="button" data-toggle-password="confirm" aria-label="Show password" aria-pressed="false">
                  <svg class="eye-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5c-5 0-9.3 3.1-11 7 1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9zm0-2.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>
                  <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.3 2.3 2 3.6l3.1 3.1C3.2 8.1 1.6 9.9 1 12c1.7 3.9 6 7 11 7 1.8 0 3.5-.4 5-1.1l3.4 3.4 1.3-1.3L3.3 2.3zM12 17c-3.7 0-6.9-2.1-8.5-5 .7-1.4 1.9-2.7 3.4-3.5l1.7 1.7A4.5 4.5 0 0 0 12 16.5V17zm0-10.5c3.7 0 6.9 2.1 8.5 5-.5 1-1.3 1.9-2.2 2.7l-1.5-1.5c.4-.5.7-1.1.7-1.7A4.5 4.5 0 0 0 12 7.5z"/></svg>
                </button>
              </div>
            </div>
          </div>
          <label class="check">
            <input type="checkbox" required />
            <span>I agree to the Fundora terms and risk disclosure.</span>
          </label>
          <button class="btn" type="submit">Create account</button>
        </form>
        <p class="switch">Already registered? <a href="login.html">Sign in</a> · <a href="support.html">Support</a></p>
      </div>
    </main>
  </div>
  <script src="js/globe.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/support-widget.js?v=8"></script>
</body>
</html>
